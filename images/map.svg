  <text x="320" y="346" font-family="sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">Elm Street</text>
  <rect x="270" y="270" width="100" height="40" rx="6" fill="#f2c14e"/>
  <text x="320" y="295" font-family="sans-serif" font-size="13" fill="#2b2a26" text-anchor="middle">Information</text>
